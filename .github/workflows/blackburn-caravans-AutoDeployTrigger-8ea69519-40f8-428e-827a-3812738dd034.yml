name: Deploy Blackburn Caravans

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BLACKBURNCARAVANS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BLACKBURNCARAVANS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BLACKBURNCARAVANS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUsername: ${{ secrets.BLACKBURNCARAVANS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BLACKBURNCARAVANS_REGISTRY_PASSWORD }}
          containerAppName: blackburn-caravans
          resourceGroup: rg-blackburn-caravans-prod
          imageToBuild: default/blackburn-caravans:${{ github.sha }}